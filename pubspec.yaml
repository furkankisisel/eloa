name: eloa
description: Eloa - İlmi Sima & El analizi için modern uygulama iskeleti.
version: 1.0.0+2
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.0.0
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  image_picker: ^1.0.7
  camera: ^0.11.0+2
  path_provider: ^2.1.2
  path: ^1.9.0
  shared_preferences: ^2.2.2
  screenshot: ^3.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  assets:
    - assets/illustrations/
    - assets/data/
    - assets/
  uses-material-design: true

# Uygulama ikonu ayarları
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#121212"
    theme_color: "#4A148C"
  windows:
    generate: true
    image_path: "assets/logo.png"
  macos:
    generate: true
    image_path: "assets/logo.png"
  # Lokalizasyon üretimi için:
  # flutter pub run flutter_gen_l10n
